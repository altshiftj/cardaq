# Authored WireViz input. Pin groups denote a net shared by two board contacts.
# Mini-Box DCDC-USB Quick Installation Guide v1.0c, pp. 2–5.
metadata:
  title: Recorder power / Mini-Box PWR-DCDC-USB
  revision: '0.6'
options:
  fontname: Arial
  color_mode: full
  mini_bom_mode: false
connectors:
  CIVIC:
    type: Vehicle connection points
    pins: [B+, ACC, GND]
    pinlabels: [Fused constant battery, Fused switched sense, Chassis return]
    show_pincount: false
    notes: "Fuse slots, branch ratings and\nground point to be selected."
    bgcolor_title: '#dce8f2'
  IN:
    type: Left Mini-Fit Jr · 4 contacts
    pins: [4, 3, '1/2']
    pinlabels: [VIN, IGN, GND]
    show_pincount: false
    notes: 10 A input fuse on board
    bgcolor_title: '#dce8f2'
  OUT:
    type: Right Mini-Fit Jr · 4 contacts
    pins: ['3/4', '1/2']
    pinlabels: [VOUT, GND]
    show_pincount: false
    notes: "Factory setting 12 V.\nSelect 5 V with Pi disconnected."
    bgcolor_title: '#dce8f2'
  USB-C:
    type: USB-C source assembly
    pins: ['+', '−']
    pinlabels: [5 V in, Return]
    show_pincount: false
    notes: "5 V / 3 A USB-C source plug.\nSource/CC hardware, gauge and length TBD."
    bgcolor_title: '#ddeddf'
  Pi 4B:
    style: simple
    show_name: true
    type: USB-C power inlet
    notes: "Dashed arrow = plug mate.\nUSB SSD draws from Pi."
    bgcolor_title: '#ddeddf'
cables:
  Vehicle leads:
    colors: [RD, WH, BK]
    show_wirenumbers: false
    show_wirecount: false
    bgcolor_title: '#f6e8cf'
  Regulated leads:
    colors: [YE, '']
    wirelabels: [VOUT, Return color TBD]
    show_wirenumbers: false
    show_wirecount: false
    bgcolor_title: '#f6e8cf'
connections:
  - - CIVIC: [B+, ACC, GND]
    - Vehicle leads: [1, 2, 3]
    - IN: [4, 3, '1/2']
  # Draw the output row back toward the left to keep the board headers together.
  - - USB-C: ['+', '−']
    - Regulated leads: [1, 2]
    - OUT: ['3/4', '1/2']
  - [Pi 4B, <==, USB-C]
tweak:
  override:
    graph:
      label: 'Recorder power  /  Mini-Box PWR-DCDC-USB to Raspberry Pi 4B\n2020 Civic LX   ·   Rev. 0.6   ·   PROPOSED'
      labelloc: t
      labeljust: l
      fontsize: '18'
      fontcolor: '"#172f45"'
      ranksep: '0.33'
      nodesep: '0.30'
      pad: '0.20'
      newrank: 'true'
    node:
      fontsize: '12'
    edge:
      arrowsize: '0.65'
  append:
    - |
      subgraph cluster_dcdc {
        label="Mini-Box PWR-DCDC-USB";
        color="#93adbf"; fontcolor="#315976"; fontsize=15;
        style="rounded"; margin=12;
        board_map [shape=plain, label=<
          <TABLE BORDER="0" CELLBORDER="1" CELLSPACING="0" CELLPADDING="4" COLOR="#93adbf">
            <TR><TD COLSPAN="5" BGCOLOR="#eaf1f5"><B>Board layout · Guide Fig. 1.0</B></TD></TR>
            <TR><TD COLSPAN="5">View from above · mini-USB at upper right</TD></TR>
            <TR><TD COLSPAN="2"><B>Left IN</B></TD><TD ROWSPAN="3"> </TD><TD COLSPAN="2"><B>Right OUT</B></TD></TR>
            <TR><TD>2 GND</TD><TD>4 VIN</TD><TD>3 VOUT</TD><TD>1 GND</TD></TR>
            <TR><TD>1 GND</TD><TD>3 IGN</TD><TD>4 VOUT</TD><TD>2 GND</TD></TR>
            <TR><TD COLSPAN="5">Slash-separated contact numbers share a net.<BR/>Verify populated cavities and plug orientation.</TD></TR>
            <TR><TD COLSPAN="5">Mini-USB is for setup.<BR/>VAUX carries switched vehicle voltage.</TD></TR>
          </TABLE>>];
        {rank=same; IN; OUT; board_map;}
      }
      checkout [shape=plain, label=<
        <TABLE BORDER="0" CELLBORDER="0" CELLSPACING="0" CELLPADDING="3">
          <TR><TD ALIGN="LEFT"><FONT COLOR="#315976"><B>Before connecting the Pi</B></FONT></TD></TR>
          <TR><TD ALIGN="LEFT" BALIGN="LEFT">Confirm the 5 V setting for the board revision.<BR/>Power-cycle, then meter polarity at the plug.<BR/>Verify 5 V with a 3 A dummy load at the plug.</TD></TR>
        </TABLE>>];
      ignition [shape=plain, label=<
        <TABLE BORDER="0" CELLBORDER="0" CELLSPACING="0" CELLPADDING="3">
          <TR><TD ALIGN="LEFT"><FONT COLOR="#315976"><B>Key-off test · keep dummy load connected</B></FONT></TD></TR>
          <TR><TD ALIGN="LEFT" BALIGN="LEFT">Select automotive mode and a finite HARDOFF above zero.<BR/>Time IGN loss → PSW pulse → loss of 5 V at plug.<BR/>PSW needs a Pi-compatible interface. Allow time for<BR/>SSD file close and OS halt before power falls.</TD></TR>
        </TABLE>>];
      {rank=same; CIVIC; "USB-C"; checkout;}
      {rank=same; "Vehicle leads"; "Regulated leads"; ignition;}
      IN -- OUT -- board_map [style=invis, weight=50];
      CIVIC -- "USB-C" -- checkout [style=invis, weight=50];
      "Vehicle leads" -- "Regulated leads" -- ignition [style=invis, weight=50];
      checkout -- ignition -- board_map [style=invis, weight=0];
