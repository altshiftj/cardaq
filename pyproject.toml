[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "cardaq"
version = "0.1.0"
description = "Record OBD-II telemetry and explore Honda Civic drive logs in an offline viewer"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT AND CC-BY-SA-4.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "LICENSES/CC-BY-SA-4.0.txt"]
keywords = ["obd-ii", "obdlink", "honda", "vehicle-telemetry"]
dependencies = ["pyserial==3.5"]

[project.urls]
Repository = "https://github.com/altshiftj/cardaq"
Issues = "https://github.com/altshiftj/cardaq/issues"

[project.scripts]
cardaq = "cardaq.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I"]

[tool.ruff.lint.isort]
lines-after-imports = 2
combine-as-imports = true

[tool.setuptools.package-data]
"cardaq.viewer" = ["*.html", "*.css", "*.js"]

[dependency-groups]
dev = [
    "pre-commit==4.7.0",
]
